# Production RTSP/TCP listener for /bosai. Anonymous reads are intentional for
# VRChat compatibility; publishing remains limited to loopback.
rtsp: true
rtspAddress: 0.0.0.0:8554
rtspTransports: [tcp]
rtmp: false
hls: false
moq: false
webrtc: false
srt: false
api: false
metrics: false
pprof: false

authMethod: internal
authInternalUsers:
  - user: any
    ips: ["127.0.0.1", "::1"]
    permissions:
      - action: publish
        path: bosai
      - action: publish
        path: bosai-overlay
      - action: publish
        path: bosai-demo
  - user: any
    permissions:
      - action: read
        path: bosai
      - action: read
        path: bosai-overlay
      - action: read
        path: bosai-demo

paths:
  bosai:
    source: publisher
  # Since 2026-11-16 the overlay is published on /bosai itself
  # (overlay-only operation); the old path redirects to it.
  bosai-overlay:
    source: redirect
    sourceRedirect: rtspt://stream.usuiensan.dev:8554/bosai
  bosai-demo:
    source: publisher
