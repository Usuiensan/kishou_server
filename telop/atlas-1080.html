<title>EEW Telop</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Noto Sans JP", sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; }

  /* ===== 横パターン (実測 img2: x234-1036 y374-641 / 地図セル214幅 / 帯50) ===== */
  #eew-box { position: absolute; left: 234px; top: 374px; width: 803px; height: 268px;
    border: 10px solid #fff; border-radius: 8px; overflow: hidden; display: none;
    box-sizing: border-box; }
  #eew-box.on { display: flex; }
  #map-cell { width: 214px; height: 100%; flex: none; background: #505990;
    border-right: 3px solid #fff; box-sizing: border-box; }
  #map-cell svg { display: block; width: 100%; height: 100%; }
  #body-cell { flex: 1; display: flex; flex-direction: column; }
  #title-band { height: 50px; background: #ff4b00; color: #fff; font-weight: 900;
    font-size: 32px; display: flex; align-items: center; justify-content: center;
    letter-spacing: 1px; }
  #body-main { flex: 1; background: #296cc7; padding: 10px 20px; box-sizing: border-box; }
  #headline { color: #fcee21; font-weight: 900; font-size: 29px; white-space: nowrap; }
  #areas { color: #fff; font-weight: 900; font-size: 34px; margin-top: 18px;
    white-space: normal; line-height: 1.3; }

  /* ===== 縦パターン (実測 img1: 帯 x37-170 y85-691 / ラベル柱30幅 / 地図137x97) ===== */
  #eew-v { position: absolute; left: 37px; top: 85px; width: 158px; height: 565px;
    border: 10px solid #fff; box-sizing: border-box; display: none;
    flex-direction: column; background: #296cc7; overflow: hidden; }
  #eew-v.on { display: flex; }
  #v-upper { flex: 1; display: flex; flex-direction: row; min-height: 0; }
  /* 実物: 見出しは専用カラム、地名は見出しと混ざらず新しいカラムから始まる */
  /* 縦も横と同じ14単位ルールでカラムを割る (能登2回目: 石川…岐阜=14単位で満杯、群馬は次カラム)。
     ブラウザのピクセル折り返しに任せない */
  #v-areas { flex: 1; display: flex; flex-direction: row-reverse; padding: 50px 26px 0 6px; box-sizing: border-box;
    overflow: hidden; color: #fff; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1; }
  #v-areas .vcol { writing-mode: vertical-rl; }
  #v-areas .vtok { display: inline-block; margin-inline-end: 14px; }
  #v-headline-box { writing-mode: vertical-rl; padding: 16px 2px 10px; box-sizing: border-box; overflow: hidden; }
  #v-headline { color: #fcee21; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1.15; }
  #v-side { width: 38px; flex: none; display: flex; flex-direction: column; }
  #v-label-inner { background: #ff4b00; color: #fff; font-weight: 900; font-size: 24px;
    writing-mode: vertical-rl; padding: 12px 0; text-align: center; letter-spacing: 2px; }
  #v-map { width: 100%; height: 84px; flex: none; background: #505990;
    border-top: 3px solid #fff; box-sizing: border-box; }
  #v-map svg { display: block; width: 100%; height: 100%; }

  /* 続報で追加された範囲の点滅 (黄⇔白, 約5.6秒で静止) */
  /* 追加範囲の点滅: 黄色 ⇔ 地色グレー の 1-0 瞬時切り替え (中間のグラデーションなし)。
     2022-03-16 福島県沖の実放送を計測: 周期約1.0秒 (ON/OFF 各約0.5秒)、
     OFF は白ではなく対象外の県と同じ地色 (実測 RGB 約 (140,138,140))、
     少なくとも6秒以上継続。文字側は点滅しない */
  @keyframes eewblink { 0%, 100% { fill: #989898; } 50% { fill: #f5e216; } }
  .blink-new { animation: eewblink 1s steps(1, jump-end) 4.5; }
  /* オプション: 追加地域のテキスト点滅 (白=通常色 ⇔ 黄、地図と同じ位相で最後は白に戻る) */
  @keyframes eewblinkText { 0%, 100% { color: #fff; } 50% { color: #f5e216; } }
  .blink-text { animation: eewblinkText 1s steps(1, jump-end) 5; }
</style>

  #tsunami-mini { position:relative; }

  .tm-coast { fill:none; stroke:#151515; stroke-linecap:round; stroke-linejoin:round; }
  .tm-zone { fill:none; stroke-linecap:butt; stroke-linejoin:round; }

  ["渡島地方", "北海道道南"], ["檜山地方", "北海道道南"], ["胆振地方", "北海道道南"],
  ["日高地方", "北海道道南"], ["奥尻島", "北海道道南"],
  ["上川地方", "北海道道北"], ["留萌地方", "北海道道北"], ["宗谷地方", "北海道道北"],
  ["利尻礼文", "北海道道北"],
  ["網走地方", "北海道道東"], ["北見地方", "北海道道東"], ["紋別地方", "北海道道東"],
  ["十勝地方", "北海道道東"], ["釧路地方", "北海道道東"], ["根室地方", "北海道道東"],

/* 見出し用: 石川県能登地方→石川県 (県名より後は落とす。ただし沖・近海を含む沖合名は残す) */

  "滋賀県":"近畿", "京都府":"近畿", "大阪府":"近畿", "兵庫県":"近畿", "奈良県":"近畿", "和歌山県":"近畿",

  for (const p of prefs) {

  for (const p of prefs) {

    if (p === "新潟県") { out.push("新潟"); continue; }
    if (p === "山梨県" || p === "長野県") {
      if (grouped && koshin) {

      } else out.push(shortName(p));

    const r = REGION_OF[p];

/* ========= ミニマップ ========= */
function polyBBox(poly) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const ring of poly) for (const [x, y] of ring) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return [x0, y0, x1, y1];
}
/* フィット用ポリゴン: 本体クラスタ近傍のみ (沖縄の離島で潰れるのを防ぐ)。
   沖縄はエリア名の島嶼区分 (本島/宮古/八重山/大東) で帯を絞る */
function fitPolys(pref, areaNames) {
  const p = prefByName[pref];
  if (pref === "沖縄県") {
    const bands = [];
    const has = (k) => (areaNames || []).some(a => a.includes(k));
    if (has("八重山")) bands.push([122.0, 123.9]);
    if (has("宮古")) bands.push([124.4, 126.3]);
    if (has("大東")) bands.push([129.5, 132.0]);
    if (has("本島") || bands.length === 0) bands.push([126.2, 129.5]);
    return p.polys.filter(poly => {
      const b = polyBBox(poly), c = (b[0] + b[2]) / 2;
      return bands.some(([lo, hi]) => c >= lo && c <= hi);
    });
  }
  let big = null, bigArea = -1;
  for (const poly of p.polys) {
    const b = polyBBox(poly), a = (b[2] - b[0]) * (b[3] - b[1]);
    if (a > bigArea) { bigArea = a; big = b; }
  }
  const M = 2.2;
  return p.polys.filter(poly => {
    const b = polyBBox(poly);
    return b[2] >= big[0] - M && b[0] <= big[2] + M && b[3] >= big[1] - M && b[1] <= big[3] + M;
  });

    return (i === 0 ? "M" : "L") + px.toFixed(1) + " " + py.toFixed(1);
  }).join("") + "Z";
}
const _hctx = document.createElement("canvas").getContext("2d");
/* 見出しが欄幅を超える場合のみ縮小する (長い震源名で文字が切れるのを防ぐ) */
function fitHeadline(el) {
  el.style.fontSize = "29px";

  const w = _hctx.measureText(el.textContent).width;
  const avail = el.clientWidth || 549;
  if (w > avail) el.style.fontSize = Math.max(19, Math.floor(29 * avail / w)) + "px";

function renderMap(cell, prefs, areaNames, epi, CW, CH, blinkSet) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (b) => { x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); };
  const cz = HAS_HKZ ? coveredZonesFor(prefs, areaNames) : [];
  const fitNames = cz.length ? prefs.filter(t => t !== "北海道").concat(cz) : prefs;
  for (const t of fitNames) for (const poly of fitPolys(t, areaNames)) grow(polyBBox(poly));
  if (epi) { x0 = Math.min(x0, epi.lon); x1 = Math.max(x1, epi.lon); y0 = Math.min(y0, epi.lat); y1 = Math.max(y1, epi.lat); }
  if (x0 > x1) { x0 = 129; x1 = 147; y0 = 31; y1 = 46; }
  const rawBox = [x0, y0, x1, y1];
  const padX = (x1 - x0) * 0.16 + 0.12, padY = (y1 - y0) * 0.16 + 0.10;
  x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
  if (x1 - x0 < 2.2) { const c = (x0 + x1) / 2; x0 = c - 1.1; x1 = c + 1.1; }
  if (y1 - y0 < 1.8) { const c = (y0 + y1) / 2; y0 = c - 0.9; y1 = c + 0.9; }
  const midLat = (y0 + y1) / 2, kx = Math.cos(midLat * Math.PI / 180);
  const contain = Math.min(CW / ((x1 - x0) * kx), CH / (y1 - y0));
  const slice = Math.max(CW / ((x1 - x0) * kx), CH / (y1 - y0));
  let scale = Math.min(slice, contain * 1.4); // 対象がはみ出さない範囲でセルを埋める
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  /* ズームで震源×や対象範囲がセル外へ出ないよう scale を制限する。

  s += `<rect width="${CW}" height="${CH}" fill="#505990"/>`;
  for (const p of PREFS) {
    if (HAS_HKZ && p.name === "北海道") continue; // 予報区ポリゴンで描く
    const fill = tset.has(p.name) ? "#f5e216" : "#989898";
    const cls = bset.has(p.name) ? ' class="blink-new"' : "";
    for (const poly of p.polys) for (const ring of poly)
      s += `<path d="${ringPath(ring, proj)}" fill="${fill}" stroke="#666666" stroke-width="1"${cls}/>`;
  }
  if (HAS_HKZ) for (const z of HK4) {
    const fill = cz.includes(z) ? "#f5e216" : "#989898";
    const zcls = bset.has(z) ? ' class="blink-new"' : "";
    for (const poly of prefByName[z].polys) for (const ring of poly)
      s += `<path d="${ringPath(ring, proj)}" fill="${fill}" stroke="#666666" stroke-width="1" fill-rule="evenodd"${zcls}/>`;
  }
  if (epi) {
    /* 震源×は固定寸法。初版 r=13.5 (芯27px・白縁込み約36px) は地図に対して
       大きすぎたため r=9 に縮小 (2026-11-09 本人指示) */
    const [ex, ey] = proj(epi.lon, epi.lat);
    const r = 9;
    s += `<g stroke-linecap="round"><path d="M ${ex - r} ${ey - r} L ${ex + r} ${ey + r} M ${ex + r} ${ey - r} L ${ex - r} ${ey + r}" stroke="#fff" stroke-width="10"/><path d="M ${ex - r} ${ey - r} L ${ex + r} ${ey + r} M ${ex + r} ${ey - r} L ${ex - r} ${ey + r}" stroke="#e60012" stroke-width="${r * 0.46}"/></g>`;
  }
  s += "</svg>";
  cell.innerHTML = s;
}

  for (const t of tokens) {
    if (addedZones.has(t)) { out.add(t); continue; }
    if (vertical) {

      const covered = t === "甲信" ? ["山梨県", "長野県"]

          : Object.values(REGION_OF).includes(t) ? prefs.filter(p => REGION_OF[p] === t)
            : pref ? [pref] : [];
      if (covered.some(p => added.has(p))) out.add(t);
      continue;
    }
    const pref = areaToPref(t);
    const covered = t === "甲信" ? ["山梨県", "長野県"]
      : t === "新潟" ? ["新潟県"]
        : Object.values(REGION_OF).includes(t) ? prefs.filter(p => REGION_OF[p] === t)

      if (prepend) chain.unshift(...p.slice(0, -1)); else chain.push(...p.slice(1));

  };

    if (used.has(i)) continue;
    used.add(i);

        lEnabled = lActive;
        if (lTransitionTimer) clearTimeout(lTransitionTimer);
        keepHorizontalForVertical = lActive;
        if (lActive) {
          lTransitionTimer = setTimeout(() => {
            keepHorizontalForVertical = false;
            if (root.ATLAS_LAST_SNAPSHOT) applyAtlasSnapshot(root.ATLAS_LAST_SNAPSHOT);
          }, 1000);
        } else {
          lTransitionTimer = null;
        }
        if (root.ATLAS_LAST_SNAPSHOT) applyAtlasSnapshot(root.ATLAS_LAST_SNAPSHOT);
      }
    }

    function syncAlpha() {
      if (!alpha) return;
      alpha.replaceChildren();
      if (eewElement?.classList.contains('on')) {
        const mask = document.createElement('div');
        mask.className = 'atlas-alpha-eew';
        mask.setAttribute('aria-hidden', 'true');
        Object.assign(mask.style, { left: `${eewLeft}px`, top: '270px', width: '803px', height: '268px' });
        alpha.appendChild(mask);
      }
      if (tsunamiVisible && tsunamiElement) {
        const mirror = tsunamiElement.cloneNode(true);
        mirror.classList.add('atlas-alpha-tsunami');
        mirror.setAttribute('aria-hidden', 'true');
        mirror.style.top = '174px';
        mirror.style.left = '1357px';
        mirror.style.backgroundColor = '#999';
        const force = (selector, properties) => mirror.querySelectorAll(selector).forEach((element) => {
          for (const [name, value] of Object.entries(properties)) element.style.setProperty(name, value, 'important');
        });
        force('.tm-land', { fill: '#fff', stroke: '#fff' });
        force('.tm-coast, .tm-zone', { fill: 'none', stroke: '#fff' });
        force('.tm-label, .tm-legend-label, text, rect', { fill: '#fff', stroke: '#fff' });
        alpha.appendChild(mirror);
      }
    }

    function showIntensity(data, summaryFrames = [], tsunamiFrames = []) {
      if (!intensity) return;
      if (lineTimer) clearInterval(lineTimer);
      lineTimer = null;
      lineIndex = 0;
      intensity.replaceChildren();
      const groups = data?.cityGroups && Object.keys(data.cityGroups).length ? data.cityGroups : data?.groups;
      const levels = ['7', '6+', '6-', '5+', '5-', '4', '3', '2', '1'];
      const labels = { '6+': '6強', '6-': '6弱', '5+': '5強', '5-': '5弱' };
      const rows = [];
      for (const level of levels) {
        let names = [];
        let characters = 0;
        for (const name of groups?.[level] || []) {
          const length = [...name].length + (names.length ? 1 : 0);
          if (names.length && characters + length > 21) {
            rows.push({ level, names, first: !rows.some((row) => row.level === level) });
            names = [];
            characters = 0;
          }
          names.push(name);
          characters += [...name].length + (names.length > 1 ? 1 : 0);
        }
        if (names.length) rows.push({ level, names, first: !rows.some((row) => row.level === level) });
      }
      const earthquakeFrames = tsunamiFrames.length ? [] : summaryFrames;
      const rowPages = tsunamiFrames.length ? 0 : Math.ceil(rows.length / 2);
      const pageCount = tsunamiFrames.length || earthquakeFrames.length + rowPages;
      if (!pageCount) return;
      const render = () => {
        intensity.replaceChildren();
        if (tsunamiFrames.length) {
          const frame = tsunamiFrames[lineIndex];
          if (frame.level === 'notice') {
            const notice = document.createElement('div');
            notice.className = 'atlas-summary-line';
            notice.textContent = frame.label;
            intensity.appendChild(notice);
            lineIndex = (lineIndex + 1) % pageCount;
            return;
          }
          const category = document.createElement('div');
          category.className = `atlas-tsunami-line atlas-tsunami-${frame.level}`;
          const badge = document.createElement('span');
          badge.className = 'atlas-tsunami-badge';
          badge.textContent = frame.label;
          const style = { major: '#c800ff', warning: '#ff2800', advisory: '#faf500' };
          badge.style.backgroundColor = style[frame.level] || '#ff2800';
          category.appendChild(badge);
          if (frame.additional) {
            const addition = document.createElement('span');
            addition.className = 'atlas-tsunami-additional';
            addition.textContent = '追加';
            category.appendChild(addition);
          }
          const area = document.createElement('span');
          area.className = 'atlas-tsunami-text';
          area.textContent = frame.area;
          category.appendChild(area);
          intensity.appendChild(category);
          const detail = document.createElement('div');
          detail.className = 'atlas-tsunami-line atlas-tsunami-detail';
          const forecast = document.createElement('span');
          forecast.className = 'atlas-tsunami-forecast-badge';
          forecast.textContent = '予想高さ';
          const values = document.createElement('span');
          values.className = 'atlas-tsunami-text';
          values.textContent = `${frame.height}　${frame.arrival}`;
          detail.append(forecast, values);
          intensity.appendChild(detail);
        } else if (lineIndex < earthquakeFrames.length) {
          for (const text of earthquakeFrames[lineIndex].lines || []) {
            if (!text) continue;
            const line = document.createElement('div');
            line.className = 'atlas-summary-line';
            line.textContent = text;
            intensity.appendChild(line);
          }
        } else {
          const page = lineIndex - earthquakeFrames.length;
          const start = page * 2;
          for (let offset = 0; offset < 2 && start + offset < rows.length; offset += 1) {
            const row = rows[start + offset];
            const line = document.createElement('div');
            line.className = `atlas-intensity-row ${offset === 0 ? 'top' : 'bottom'}`;
            const badge = document.createElement('span');
            const showBadge = row.first || offset === 0;
            badge.className = showBadge ? 'atlas-intensity-badge' : 'atlas-intensity-continuation';
            badge.textContent = showBadge ? `震度${labels[row.level] || row.level}` : '';
            const areas = document.createElement('span');
            areas.className = 'atlas-intensity-areas';
            row.names.forEach((name, index) => {
              if (index) areas.append('　');
              const appendRuby = (base, reading) => {
                if (!base) return;
                if (!reading) {
                  areas.append(base);
                  return;
                }
                const ruby = document.createElement('ruby');
                ruby.textContent = base;
                const rt = document.createElement('rt');
                rt.textContent = reading;
                ruby.appendChild(rt);
                areas.appendChild(ruby);
              };
              const reading = data.cityReadings?.[name];
              if (!reading) {
                areas.append(name);
                return;
              }
              let baseIndex = 0;
              let readingIndex = 0;
              for (const match of name.matchAll(/[ぁ-ゖ]+/gu)) {
                const readingMatch = reading.indexOf(match[0], readingIndex);
                if (readingMatch < readingIndex) {
                  areas.append(name.slice(baseIndex));
                  baseIndex = name.length;
                  break;
                }
                appendRuby(name.slice(baseIndex, match.index), reading.slice(readingIndex, readingMatch));
                areas.append(match[0]);
                baseIndex = match.index + match[0].length;
                readingIndex = readingMatch + match[0].length;
              }
              appendRuby(name.slice(baseIndex), reading.slice(readingIndex));
            });
            line.append(badge, areas);
            intensity.appendChild(line);
          }
        }
        lineIndex = (lineIndex + 1) % pageCount;
      };
      render();
      if (pageCount > 1) lineTimer = setInterval(render, 7500);
    }

    function applyAtlasSnapshot(snapshot) {
      const view = composeAtlasView(snapshot);
      root.ATLAS_LAST_SNAPSHOT = snapshot;
      updateTsunamiSuper(view.tsunamiFrames);
      if (clock) clock.textContent = new Intl.DateTimeFormat('ja-JP', { timeZone: 'Asia/Tokyo', hour: '2-digit', minute: '2-digit' }).format(new Date());
      if (sourceStatus) {
        const stale = view.staleSources;
        sourceStatus.textContent = stale.length ? `情報源未更新: ${stale.join(' / ').toUpperCase()}` : '';
        sourceStatus.style.display = stale.length ? 'block' : 'none';
      }

      const eew = view.eew;
      const eewKey = eew ? `${eew.event.id}:${eew.event.serial}:${eew.event.publishedAt}` : '';
      const { horizontal: eewHorizontal, vertical: eewVertical } = eewVisibility(view.display, lEnabled, keepHorizontalForVertical);
      let alphaDirty = false;
      if (eewKey !== lastEew || eewHorizontal !== lastEewHorizontal || eewVertical !== lastEewVertical) {
        if (eew?.payload?.render) {
          const input = eew.payload.render;
          if (eewHorizontal) {
            if (eewKey !== lastEew && lastEewHorizontal && lastEew?.startsWith(`${eew.event.id}:`) && typeof renderEEWUpdate === 'function') renderEEWUpdate(input);
            else renderEEW(input);
          } else eewElement?.classList.remove('on');
          if (eewVertical) renderEEWVertical(input);
          else verticalEewElement?.classList.remove('on');
        } else {
          eewElement?.classList.remove('on');
          verticalEewElement?.classList.remove('on');
        }
        lastEew = eewKey;
        lastEewHorizontal = eewHorizontal;
        lastEewVertical = eewVertical;
        alphaDirty = true;
      }

      const tsunamiJson = JSON.stringify(view.tsunami);
      const hasTsunamiAreas = Object.values(view.tsunami).some((areas) => areas.some((area) => String(area).trim()));
      const nextTsunamiVisible = view.display.tsunamiMap !== false && hasTsunamiAreas;
      const tsunamiRenderKey = `${tsunamiJson}:${view.display.tsunamiLines !== false}`;
      if (tsunamiRenderKey !== lastTsunami || nextTsunamiVisible !== tsunamiVisible) {
        tsunamiVisible = nextTsunamiVisible;
        if (tsunamiElement) {
          tsunamiElement.style.display = tsunamiVisible ? '' : 'none';
          if (tsunamiVisible && typeof renderTsunamiMini === 'function') renderTsunamiMini({ ...view.tsunami, linesVisible: view.display.tsunamiLines !== false });
          else if (!tsunamiVisible) tsunamiElement.replaceChildren();
        }
        lastTsunami = tsunamiRenderKey;
        alphaDirty = true;
      }
      const verticalEewVisible = verticalEewElement?.classList.contains('on') === true;
      const leftMapEnabled = view.display.tsunamiLeftMap !== false;
      const leftMapKey = `${tsunamiJson}:${view.display.tsunamiLines !== false}:${leftMapEnabled}:${verticalEewVisible}`;
      const nextTsunamiLeftVisible = leftMapEnabled && !verticalEewVisible && hasTsunamiAreas;
      if (leftMapKey !== lastTsunamiLeft || nextTsunamiLeftVisible !== tsunamiLeftVisible) {
        tsunamiLeftVisible = nextTsunamiLeftVisible;
        if (tsunamiLeftElement) {
          tsunamiLeftElement.style.display = tsunamiLeftVisible ? '' : 'none';
          if (tsunamiLeftVisible && typeof renderTsunamiMini === 'function') {
            renderTsunamiMini({ ...view.tsunami, linesVisible: view.display.tsunamiLines !== false }, tsunamiLeftElement);
          } else if (!tsunamiLeftVisible) tsunamiLeftElement.replaceChildren();
        }
        lastTsunamiLeft = leftMapKey;
      }
      const intensityJson = `${JSON.stringify(view.intensity)}:${JSON.stringify(view.summaryFrames)}:${JSON.stringify(view.tsunamiFrames)}:${view.display.earthquakeTelop !== false}`;
      if (intensityJson !== lastIntensity) {
        showIntensity(view.display.earthquakeTelop !== false ? view.intensity : null,
          view.display.earthquakeTelop !== false ? view.summaryFrames : [], view.tsunamiFrames);
        lastIntensity = intensityJson;
      }
      if (headline) {
        headline.replaceChildren();
        const noTsunamiWorry = view.summaryFrames.some((frame) => frame.lines?.includes('津波の心配はありません'));
        if (lEnabled && noTsunamiWorry && view.display.earthquakeTelop !== false) {
          headline.textContent = '津波の心配なし';
          headline.style.display = 'block';
          headline.style.color = '#fff';
        } else if (view.display.earthquakeTelop === false) {
          headline.style.display = 'none';
          headline.textContent = '';
        } else {
          headline.style.display = 'none';
          headline.style.color = '';
          if (view.headline?.place && view.headline.reading) {
            const ruby = document.createElement('ruby');
            ruby.textContent = view.headline.place;
            const reading = document.createElement('rt');
            reading.textContent = view.headline.reading;
            ruby.appendChild(reading);
            const number = document.createElement('span');
            number.className = 'atlas-headline-number';
            number.textContent = view.headline.intensity;
            headline.append(ruby, 'で震度', number);
          } else {
            headline.textContent = view.headline?.text || '';
          }
        }
      }
      if (alphaDirty) syncAlpha();
      root.ATLAS_RENDER_READY = true;
    }

    root.applyAtlasSnapshot = applyAtlasSnapshot;
    root.applyAtlasControls = applyControls;
    if (initialSnapshot) applyAtlasSnapshot(initialSnapshot);
    async function poll() {
      try {
        const response = await fetch(`atlas-state.json?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          applyAtlasSnapshot(await response.json());
          root.ATLAS_SNAPSHOT_RECEIVED = true;
        }
      } catch (_) { /* Keep the last rendered snapshot while the state file is unavailable. */ }
      setTimeout(poll, 1000);
    }
    poll();
  }

  return { composeAtlasView, staleSources, install, syncTsunamiBlinkClock, eewVisibility };
});

if (typeof document !== 'undefined') AtlasLive.install(globalThis.ATLAS_INITIAL_STATE);
</script>
