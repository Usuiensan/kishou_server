<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EEW Telop</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Noto Sans JP", sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; }

  /* ===== 横パターン (実測 img2: x234-1036 y374-641 / 地図セル214幅 / 帯50) ===== */
  #eew-box { position: absolute; left: 234px; top: 374px; width: 803px; height: 268px;
    border: 3px solid #fff; border-radius: 12px; overflow: hidden; display: none;
    box-sizing: border-box; }
  #eew-box.on { display: flex; }
  #map-cell { width: 214px; height: 100%; flex: none; background: #505990;
    border-right: 3px solid #fff; box-sizing: border-box; }
  #map-cell svg { display: block; width: 100%; height: 100%; }
  #body-cell { flex: 1; display: flex; flex-direction: column; }
  #title-band { height: 50px; background: #ff4b00; color: #fff; font-weight: 900;
    font-size: 32px; display: flex; align-items: center; justify-content: center;
    letter-spacing: 1px; }
  #body-main { flex: 1; background: #296cc7; padding: 10px 20px; box-sizing: border-box; }
  #headline { color: #fcee21; font-weight: 900; font-size: 29px; white-space: nowrap; }
  #areas { color: #fff; font-weight: 900; font-size: 34px; margin-top: 18px;
    white-space: normal; line-height: 1.3; }

  /* ===== 縦パターン (実測 img1: 帯 x37-170 y85-691 / ラベル柱30幅 / 地図137x97) ===== */
  #eew-v { position: absolute; left: 37px; top: 85px; width: 158px; height: 565px;
    border: 3px solid #fff; box-sizing: border-box; display: none;
    flex-direction: column; background: #296cc7; overflow: hidden; }
  #eew-v.on { display: flex; }
  #v-upper { flex: 1; display: flex; flex-direction: row; min-height: 0; }
  /* 実物: 見出しは専用カラム、地名は見出しと混ざらず新しいカラムから始まる */
  /* 縦も横と同じ14単位ルールでカラムを割る (能登2回目: 石川…岐阜=14単位で満杯、群馬は次カラム)。
     ブラウザのピクセル折り返しに任せない */
  #v-areas { flex: 1; display: flex; flex-direction: row-reverse; padding: 14px 6px; box-sizing: border-box;
    overflow: hidden; color: #fff; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1.18; }
  #v-areas .vcol { writing-mode: vertical-rl; }
  #v-areas .vtok { display: inline-block; }
  #v-headline-box { writing-mode: vertical-rl; padding: 16px 2px 10px; box-sizing: border-box; overflow: hidden; }
  #v-headline { color: #fcee21; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1.15; }
  #v-side { width: 38px; flex: none; display: flex; flex-direction: column; }
  #v-label-inner { background: #ff4b00; color: #fff; font-weight: 900; font-size: 24px;
    writing-mode: vertical-rl; padding: 12px 0; text-align: center; letter-spacing: 2px; }
  #v-map { width: 100%; height: 84px; flex: none; background: #505990;
    border-top: 3px solid #fff; box-sizing: border-box; }
  #v-map svg { display: block; width: 100%; height: 100%; }

  /* 続報で追加された範囲の点滅 (黄⇔白, 約5.6秒で静止) */
  /* 追加範囲の点滅: 黄色 ⇔ 地色グレー の 1-0 瞬時切り替え (中間のグラデーションなし)。
     2022-03-16 福島県沖の実放送を計測: 周期約1.0秒 (ON/OFF 各約0.5秒)、
     OFF は白ではなく対象外の県と同じ地色 (実測 RGB 約 (140,138,140))、
     少なくとも6秒以上継続。文字側は点滅しない */
  @keyframes eewblink { 0%, 100% { fill: #f5e216; } 50% { fill: #989898; } }
  .blink-new { animation: eewblink 1s steps(1, jump-end) 8; }
  /* ===== テスター用コントロールパネル ===== */
  body { background: #1c1e24; }
  #panel { font-family: "Noto Sans JP", sans-serif; color: #e8e8e8; padding: 14px 18px;
    display: flex; flex-wrap: wrap; gap: 14px 22px; align-items: flex-start; }
  #panel h1 { font-size: 15px; margin: 0 0 6px; font-weight: 700; }
  #panel .grp { display: flex; flex-direction: column; gap: 5px; }
  #panel label { font-size: 12px; color: #b9bdc7; }
  #panel input[type=text], #panel input[type=number], #panel textarea {
    background: #2a2d35; color: #fff; border: 1px solid #4a4f5c; border-radius: 4px;
    padding: 5px 7px; font-size: 13px; font-family: inherit; }
  #panel textarea { width: 330px; height: 74px; }
  #panel .row { display: flex; gap: 6px; flex-wrap: wrap; }
  #panel button { background: #3a3f4c; color: #fff; border: 1px solid #596070;
    border-radius: 4px; padding: 5px 10px; font-size: 12.5px; cursor: pointer; font-family: inherit; }
  #panel button:hover { background: #4a5064; }
  #panel button.sel { background: #296cc7; border-color: #7db1ec; }
  #panel button.hot { background: #8a6d1c; border-color: #c9a227; }
  #stage-wrap { padding: 0 18px 18px; }
  #stage { background: #2b2b2b; }
</style>
</head>
<body>
<div id="panel">
  <div class="grp">
    <h1>EEWテロップ・テスター</h1>
    <label>プリセット</label>
    <div class="row" id="preset-row"></div>
  </div>
  <div class="grp">
    <label>震源名</label>
    <input type="text" id="in-hypo" style="width:170px">
    <label>緯度 / 経度</label>
    <div class="row">
      <input type="number" id="in-lat" step="0.01" style="width:90px">
      <input type="number" id="in-lon" step="0.01" style="width:90px">
    </div>
    <label>レイアウト</label>
    <div class="row">
      <button id="lay-h" class="sel">横ボックス</button>
      <button id="lay-v">縦帯</button>
    </div>
    <label>続報 (前回表示から増えた県だけ地図で点滅)</label>
    <div class="row">
      <button id="btn-update" class="hot">いまの入力を続報として描画</button>
      <button id="btn-demo" class="hot">続報デモ (愛知→静岡追加)</button>
      <button id="btn-demo-noto" class="hot">続報デモ (能登 実データ 警報1→2→3回目)</button>
    </div>
    <label>背景 (透過の見え方確認)</label>
    <div class="row" id="bg-row">
      <button data-bg="#2b2b2b" class="sel">暗グレー</button>
      <button data-bg="#00b140">緑キー</button>
      <button data-bg="#000000">黒</button>
      <button data-bg="#e8e8e8">白</button>
    </div>
  </div>
  <div class="grp">
    <label>対象エリア (1行に1件。気象庁の予報区名)</label>
    <textarea id="in-areas"></textarea>
  </div>
</div>
<div id="stage-wrap">
<div id="stage">
  <div id="eew-box">
    <div id="map-cell"></div>
    <div id="body-cell">
      <div id="title-band">緊急地震速報（気象庁）</div>
      <div id="body-main">
        <div id="headline"></div>
        <div id="areas"></div>
      </div>
    </div>
  </div>
  <div id="eew-v">
    <div id="v-upper">
      <div id="v-areas"></div>
      <div id="v-side"><div id="v-label-inner">緊急地震速報</div><div id="v-headline-box"><span id="v-headline"></span></div></div>
    </div>
    <div id="v-map"></div>
  </div>
</div></div>

<script>

  $("in-hypo").value = d.hypocenterName || "";

  $("in-lon").value = d.longitude ?? "";
  $("in-areas").value = (d.areas || []).join("\n");
}
function readForm() {
  return {
    hypocenterName: $("in-hypo").value.trim(),
    latitude: (v => Number.isFinite(v) ? v : null)(parseFloat($("in-lat").value)),
    longitude: (v => Number.isFinite(v) ? v : null)(parseFloat($("in-lon").value)),
    areas: $("in-areas").value.split(/[\n,、]/).map(s => s.trim()).filter(Boolean),
  };
}
function showOnly() {
  document.getElementById("eew-box").classList.remove("on");
  document.getElementById("eew-v").classList.remove("on");
}

  showOnly();
  if (layout === "v") renderEEWVertical(readForm()); else renderEEW(readForm());
}
function applyUpdate() {
  showOnly();
  if (layout === "v") renderEEWVerticalUpdate(readForm()); else renderEEWUpdate(readForm());
}

}
