<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>EEW Telop</title>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden;
    font-family: "Noto Sans JP", sans-serif; }
  #stage { position: relative; width: 1280px; height: 720px; }

  /* ===== 横パターン (実測 img2: x234-1036 y374-641 / 地図セル214幅 / 帯50) ===== */
  #eew-box { position: absolute; left: 234px; top: 374px; width: 803px; height: 268px;
    border: 3px solid #fff; border-radius: 8px; overflow: hidden; display: none;
    box-sizing: border-box; }
  #eew-box.on { display: flex; }
  #map-cell { width: 214px; height: 100%; flex: none; background: #505990;
    border-right: 3px solid #fff; box-sizing: border-box; }
  #map-cell svg { display: block; width: 100%; height: 100%; }
  #body-cell { flex: 1; display: flex; flex-direction: column; }
  #title-band { height: 50px; background: #ff4b00; color: #fff; font-weight: 900;
    font-size: 32px; display: flex; align-items: center; justify-content: center;
    letter-spacing: 1px; }
  #body-main { flex: 1; background: #296cc7; padding: 10px 20px; box-sizing: border-box; }
  #headline { color: #fcee21; font-weight: 900; font-size: 29px; white-space: nowrap; }
  #areas { color: #fff; font-weight: 900; font-size: 34px; margin-top: 18px;
    white-space: normal; line-height: 1.3; }

  /* ===== 縦パターン (実測 img1: 帯 x37-170 y85-691 / ラベル柱30幅 / 地図137x97) ===== */
  #eew-v { position: absolute; left: 37px; top: 85px; width: 158px; height: 565px;
    border: 3px solid #fff; box-sizing: border-box; display: none;
    flex-direction: column; background: #296cc7; overflow: hidden; }
  #eew-v.on { display: flex; }
  #v-upper { flex: 1; display: flex; flex-direction: row; min-height: 0; }
  /* 実物: 見出しは専用カラム、地名は見出しと混ざらず新しいカラムから始まる */
  /* 縦も横と同じ14単位ルールでカラムを割る (能登2回目: 石川…岐阜=14単位で満杯、群馬は次カラム)。
     ブラウザのピクセル折り返しに任せない */
  #v-areas { flex: 1; display: flex; flex-direction: row-reverse; padding: 50px 26px 0 6px; box-sizing: border-box;
    overflow: hidden; color: #fff; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1; }
  #v-areas .vcol { writing-mode: vertical-rl; }
  #v-areas .vtok { display: inline-block; margin-inline-end: 14px; }
  #v-headline-box { writing-mode: vertical-rl; padding: 16px 2px 10px; box-sizing: border-box; overflow: hidden; }
  #v-headline { color: #fcee21; font-weight: 900; font-size: 24px; letter-spacing: 2px; line-height: 1.15; }
  #v-side { width: 38px; flex: none; display: flex; flex-direction: column; }
  #v-label-inner { background: #ff4b00; color: #fff; font-weight: 900; font-size: 24px;
    writing-mode: vertical-rl; padding: 12px 0; text-align: center; letter-spacing: 2px; }
  #v-map { width: 100%; height: 84px; flex: none; background: #505990;
    border-top: 3px solid #fff; box-sizing: border-box; }
  #v-map svg { display: block; width: 100%; height: 100%; }

  /* 続報で追加された範囲の点滅 (黄⇔白, 約5.6秒で静止) */
  /* 追加範囲の点滅: 黄色 ⇔ 地色グレー の 1-0 瞬時切り替え (中間のグラデーションなし)。
     2022-03-16 福島県沖の実放送を計測: 周期約1.0秒 (ON/OFF 各約0.5秒)、
     OFF は白ではなく対象外の県と同じ地色 (実測 RGB 約 (140,138,140))、
     少なくとも6秒以上継続。文字側は点滅しない */
  @keyframes eewblink { 0%, 100% { fill: #989898; } 50% { fill: #f5e216; } }
  .blink-new { animation: eewblink 1s steps(1, jump-end) 4.5; }
  /* オプション: 追加地域のテキスト点滅 (白=通常色 ⇔ 黄、地図と同じ位相で最後は白に戻る) */
  @keyframes eewblinkText { 0%, 100% { color: #fff; } 50% { color: #f5e216; } }
  .blink-text { animation: eewblinkText 1s steps(1, jump-end) 5; }
</style>
</head>
<body>
<div id="stage">
  <div id="eew-box">
    <div id="map-cell"></div>
    <div id="body-cell">
      <div id="title-band">緊急地震速報（気象庁）</div>
      <div id="body-main">
        <div id="headline"></div>
        <div id="areas"></div>
      </div>
    </div>
  </div>
  <div id="eew-v">
    <div id="v-upper">
      <div id="v-areas"></div>
      <div id="v-side"><div id="v-label-inner">緊急地震速報</div><div id="v-headline-box"><span id="v-headline"></span></div></div>
    </div>
    <div id="v-map"></div>
  </div>
</div>
<script src="geojson.js"></script>
<script src="hkzones.js"></script>
<script>
"use strict";
/* ========= 県データ ========= */
const PREFS = PREF_GEOJSON; // [{name, polys:[ [ ring, ... ], ... ]}]
const prefByName = {};
for (const p of PREFS) prefByName[p.name] = p;
const PREF_NAMES = PREFS.map(p => p.name);

function areaToPref(area) {
  for (const n of PREF_NAMES) if (area === n || area.startsWith(n)) return n;
  return null;
}
/* 北海道は府県予報区が4つに分かれる (道央/道南/道北/道東)。
   区域名 (石狩地方中部など) → 4区分への対応。気象庁の区域名表に基づく
   (胆振・日高は道南、後志は道央) */
const HK_ZONE_OF = [
  ["石狩地方", "北海道道央"], ["空知地方", "北海道道央"], ["後志地方", "北海道道央"],
  ["渡島地方", "北海道道南"], ["檜山地方", "北海道道南"], ["胆振地方", "北海道道南"],
  ["日高地方", "北海道道南"], ["奥尻島", "北海道道南"],
  ["上川地方", "北海道道北"], ["留萌地方", "北海道道北"], ["宗谷地方", "北海道道北"],
  ["利尻礼文", "北海道道北"],
  ["網走地方", "北海道道東"], ["北見地方", "北海道道東"], ["紋別地方", "北海道道東"],
  ["十勝地方", "北海道道東"], ["釧路地方", "北海道道東"], ["根室地方", "北海道道東"],
];
const HK4 = ["北海道道央", "北海道道南", "北海道道北", "北海道道東"];
function hokkaidoZones(areas) {
  const found = [];
  for (const a of areas || []) {
    for (const z of HK4) if (a.includes(z) && !found.includes(z)) found.push(z);
    for (const [key, z] of HK_ZONE_OF)
      if (a.includes(key) && !found.includes(z)) found.push(z);
  }
  return HK4.filter(z => found.includes(z));
}

/* 北海道の予報区ポリゴン (hkzones.js)。PREFS には入れず prefByName だけに登録し、描画とフィットで差し替える */
const HAS_HKZ = (typeof HKZONES !== "undefined");
if (HAS_HKZ) for (const z of HK4) {
  const g = HKZONES[z];
  prefByName[z] = { name: z, polys: g.type === "Polygon" ? [g.coordinates] : g.coordinates };
}
/* 北海道が対象のとき、発表区域がカバーする予報区 (区域指定がなければ全区) */
function coveredZonesFor(prefList, areaNames) {
  if (!prefList.includes("北海道")) return [];
  const z = hokkaidoZones(areaNames);
  return z.length ? z : [...HK4];
}
/* 見出し用: 石川県能登地方→石川県 (県名より後は落とす。ただし沖・近海を含む沖合名は残す) */
const PREF_RE = new RegExp("^(" + PREF_NAMES.slice().sort((a, b) => b.length - a.length).join("|") + ")(.*)$");
function headlinePlace(name) {
  const m = name.match(PREF_RE);
  if (m && m[2] && !m[2].includes("沖") && !m[2].includes("近海")) return m[1];
  return name.replace(/(東部|西部|南部|北部|中部)$/, "");
}

/* 区切りは漢字1つぶん (全角スペース) で、幅の数え方でも1単位として数える。
   実例はすべて「文字数+区切り数=14」でちょうど満杯になる:
   茨城「関東 東北 新潟 甲信 静岡」10字+4、2022福島 10字+4、
   縦帯の能登3回目カラム 10字+4、青森県東方沖カラム 12字+2 */
function wrapTokens(tokens, cap) {
  const lines = [];
  let cur = "", curU = 0;
  for (const t of tokens) {
    const u = [...t].length;
    const add = cur ? u + 1 : u;
    if (cur && curU + add > cap) { lines.push(cur); cur = t; curU = u; }
    else { cur = cur ? cur + "　" + t : t; curU += add; }
  }
  if (cur) lines.push(cur);
  return lines;
}
/* 横型はまず都道府県名で表示し、2行を超える場合だけ地方名にまとめる。 */
const AREAS_FONT_SIZE = 34;
function shortName(pref) { return pref.replace(/[都府県]$/, ""); }
const REGION_OF = {
  "青森県":"東北", "岩手県":"東北", "宮城県":"東北", "秋田県":"東北", "山形県":"東北", "福島県":"東北",
  "茨城県":"関東", "栃木県":"関東", "群馬県":"関東", "埼玉県":"関東", "千葉県":"関東", "東京都":"関東", "神奈川県":"関東",
  "富山県":"北陸", "石川県":"北陸", "福井県":"北陸", "岐阜県":"東海", "静岡県":"東海", "愛知県":"東海", "三重県":"東海",
  "滋賀県":"近畿", "京都府":"近畿", "大阪府":"近畿", "兵庫県":"近畿", "奈良県":"近畿", "和歌山県":"近畿",
  "鳥取県":"中国", "島根県":"中国", "岡山県":"中国", "広島県":"中国", "山口県":"中国",
  "徳島県":"四国", "香川県":"四国", "愛媛県":"四国", "高知県":"四国",
  "福岡県":"九州", "佐賀県":"九州", "長崎県":"九州", "熊本県":"九州", "大分県":"九州", "宮崎県":"九州", "鹿児島県":"九州",
  "沖縄県":"沖縄"
};
function horizontalTokens(prefs, areas, grouped) {
  const hk = hokkaidoZones(areas);
  const koshin = prefs.includes("山梨県") && prefs.includes("長野県");
  const counts = new Map();
  for (const p of prefs) {
    const r = REGION_OF[p];
    if (r && p !== "新潟県") counts.set(r, (counts.get(r) || 0) + 1);
  }
  const out = [], emitted = new Set();
  for (const p of prefs) {
    if (p === "北海道") { out.push(...(hk.length ? hk : ["北海道"])); continue; }
    if (p === "新潟県") { out.push("新潟"); continue; }
    if (p === "山梨県" || p === "長野県") {
      if (grouped && koshin) {
        if (!emitted.has("甲信")) { out.push("甲信"); emitted.add("甲信"); }
      } else out.push(shortName(p));
      continue;
    }
    const r = REGION_OF[p];
    if (grouped && r && counts.get(r) > 1) {
      if (!emitted.has(r)) { out.push(r); emitted.add(r); }
    } else out.push(shortName(p));
  }
  return out;
}
function layoutTokens(areas) {
  return [...new Set((areas || []).filter(Boolean))];
}
function layoutAreas(prefs, areas) {
  let tokens = horizontalTokens(prefs, areas, false);
  if (wrapTokens(tokens, 14).length > 2) tokens = horizontalTokens(prefs, areas, true);
  return { lines: wrapTokens(tokens, 14), size: AREAS_FONT_SIZE };
}

/* ========= ミニマップ ========= */
function polyBBox(poly) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const ring of poly) for (const [x, y] of ring) {
    if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y;
  }
  return [x0, y0, x1, y1];
}
/* フィット用ポリゴン: 本体クラスタ近傍のみ (沖縄の離島で潰れるのを防ぐ)。
   沖縄はエリア名の島嶼区分 (本島/宮古/八重山/大東) で帯を絞る */
function fitPolys(pref, areaNames) {
  const p = prefByName[pref];
  if (pref === "沖縄県") {
    const bands = [];
    const has = (k) => (areaNames || []).some(a => a.includes(k));
    if (has("八重山")) bands.push([122.0, 123.9]);
    if (has("宮古")) bands.push([124.4, 126.3]);
    if (has("大東")) bands.push([129.5, 132.0]);
    if (has("本島") || bands.length === 0) bands.push([126.2, 129.5]);
    return p.polys.filter(poly => {
      const b = polyBBox(poly), c = (b[0] + b[2]) / 2;
      return bands.some(([lo, hi]) => c >= lo && c <= hi);
    });
  }
  let big = null, bigArea = -1;
  for (const poly of p.polys) {
    const b = polyBBox(poly), a = (b[2] - b[0]) * (b[3] - b[1]);
    if (a > bigArea) { bigArea = a; big = b; }
  }
  const M = 2.2;
  return p.polys.filter(poly => {
    const b = polyBBox(poly);
    return b[2] >= big[0] - M && b[0] <= big[2] + M && b[3] >= big[1] - M && b[1] <= big[3] + M;
  });
}
function ringPath(ring, proj) {
  return ring.map(([x, y], i) => {
    const [px, py] = proj(x, y);
    return (i === 0 ? "M" : "L") + px.toFixed(1) + " " + py.toFixed(1);
  }).join("") + "Z";
}
const _hctx = document.createElement("canvas").getContext("2d");
/* 見出しが欄幅を超える場合のみ縮小する (長い震源名で文字が切れるのを防ぐ) */
function fitHeadline(el) {
  el.style.fontSize = "29px";
  _hctx.font = '900 29px "Noto Sans JP"';
  const w = _hctx.measureText(el.textContent).width;
  const avail = el.clientWidth || 549;
  if (w > avail) el.style.fontSize = Math.max(19, Math.floor(29 * avail / w)) + "px";
}
function renderMap(cell, prefs, areaNames, epi, CW, CH, blinkSet) {
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  const grow = (b) => { x0 = Math.min(x0, b[0]); y0 = Math.min(y0, b[1]); x1 = Math.max(x1, b[2]); y1 = Math.max(y1, b[3]); };
  const cz = HAS_HKZ ? coveredZonesFor(prefs, areaNames) : [];
  const fitNames = cz.length ? prefs.filter(t => t !== "北海道").concat(cz) : prefs;
  for (const t of fitNames) for (const poly of fitPolys(t, areaNames)) grow(polyBBox(poly));
  if (epi) { x0 = Math.min(x0, epi.lon); x1 = Math.max(x1, epi.lon); y0 = Math.min(y0, epi.lat); y1 = Math.max(y1, epi.lat); }
  if (x0 > x1) { x0 = 129; x1 = 147; y0 = 31; y1 = 46; }
  const rawBox = [x0, y0, x1, y1];
  const padX = (x1 - x0) * 0.16 + 0.12, padY = (y1 - y0) * 0.16 + 0.10;
  x0 -= padX; x1 += padX; y0 -= padY; y1 += padY;
  if (x1 - x0 < 2.2) { const c = (x0 + x1) / 2; x0 = c - 1.1; x1 = c + 1.1; }
  if (y1 - y0 < 1.8) { const c = (y0 + y1) / 2; y0 = c - 0.9; y1 = c + 0.9; }
  const midLat = (y0 + y1) / 2, kx = Math.cos(midLat * Math.PI / 180);
  const contain = Math.min(CW / ((x1 - x0) * kx), CH / (y1 - y0));
  const slice = Math.max(CW / ((x1 - x0) * kx), CH / (y1 - y0));
  let scale = Math.min(slice, contain * 1.4); // 対象がはみ出さない範囲でセルを埋める
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  /* ズームで震源×や対象範囲がセル外へ出ないよう scale を制限する。
     範囲の四隅は小マージン、震源は×の半径分のマージンで判定 */
  const clampPts = [[rawBox[0], rawBox[1], 6], [rawBox[0], rawBox[3], 6],
                    [rawBox[2], rawBox[1], 6], [rawBox[2], rawBox[3], 6]];
  if (epi) clampPts.push([epi.lon, epi.lat, 21]);
  for (const [plon, plat, margin] of clampPts) {
    const dx = Math.abs(plon - cx) * kx, dy = Math.abs(plat - cy);
    if (dx > 0) scale = Math.min(scale, (CW / 2 - margin) / dx);
    if (dy > 0) scale = Math.min(scale, (CH / 2 - margin) / dy);
  }
  const proj = (lon, lat) => [CW / 2 + (lon - cx) * kx * scale, CH / 2 + (cy - lat) * scale];
  const tset = new Set(prefs);
  const bset = blinkSet || new Set();
  let s = `<svg viewBox="0 0 ${CW} ${CH}" preserveAspectRatio="none">`;
  s += `<rect width="${CW}" height="${CH}" fill="#505990"/>`;
  for (const p of PREFS) {
    if (HAS_HKZ && p.name === "北海道") continue; // 予報区ポリゴンで描く
    const fill = tset.has(p.name) ? "#f5e216" : "#989898";
    const cls = bset.has(p.name) ? ' class="blink-new"' : "";
    for (const poly of p.polys) for (const ring of poly)
      s += `<path d="${ringPath(ring, proj)}" fill="${fill}" stroke="#666666" stroke-width="1"${cls}/>`;
  }
  if (HAS_HKZ) for (const z of HK4) {
    const fill = cz.includes(z) ? "#f5e216" : "#989898";
    const zcls = bset.has(z) ? ' class="blink-new"' : "";
    for (const poly of prefByName[z].polys) for (const ring of poly)
      s += `<path d="${ringPath(ring, proj)}" fill="${fill}" stroke="#666666" stroke-width="1" fill-rule="evenodd"${zcls}/>`;
  }
  if (epi) {
    /* 震源×は固定寸法。初版 r=13.5 (芯27px・白縁込み約36px) は地図に対して
       大きすぎたため r=9 に縮小 (2026-11-09 本人指示) */
    const [ex, ey] = proj(epi.lon, epi.lat);
    const r = 9;
    s += `<g stroke-linecap="round"><path d="M ${ex - r} ${ey - r} L ${ex + r} ${ey + r} M ${ex + r} ${ey - r} L ${ex - r} ${ey + r}" stroke="#fff" stroke-width="${r * 0.70}"/><path d="M ${ex - r} ${ey - r} L ${ex + r} ${ey + r} M ${ex + r} ${ey - r} L ${ex - r} ${ey + r}" stroke="#e60012" stroke-width="${r * 0.46}"/></g>`;
  }
  s += "</svg>";
  cell.innerHTML = s;
}

/* ========= EEW描画 ========= */
function resolvePrefs(d) {
  const prefs = [];
  for (const a of d.areas || []) {
    const p = areaToPref(a) || (hokkaidoZones([a]).length ? "北海道" : null);
    if (p && !prefs.includes(p)) prefs.push(p);
  }
  return prefs;
}
/* 表示中データの状態 (続報の差分計算用) */
const eewState = { prefs: new Set(), zones: new Set() };
/* テキスト点滅オプション (既定 OFF)。ON のとき続報で追加された地域名も点滅する */
let textBlink = false;
window.setEEWTextBlink = (v) => { textBlink = !!v; };
/* 表示トークンのうち、追加された県・予報区を含むものの集合 */
function blinkTokens(prefs, areas, added, addedZones, vertical = false) {
  const out = new Set();
  const tokens = layoutAreas(prefs, areas).lines.flatMap(line => line.split("　"));
  for (const t of tokens) {
    if (addedZones.has(t)) { out.add(t); continue; }
    if (vertical) {
      const pref = areaToPref(t) || PREF_NAMES.find(p => shortName(p) === t);
      const covered = t === "甲信" ? ["山梨県", "長野県"]
        : t === "新潟" ? ["新潟県"]
          : Object.values(REGION_OF).includes(t) ? prefs.filter(p => REGION_OF[p] === t)
            : pref ? [pref] : [];
      if (covered.some(p => added.has(p))) out.add(t);
      continue;
    }
    const pref = areaToPref(t);
    const covered = t === "甲信" ? ["山梨県", "長野県"]
      : t === "新潟" ? ["新潟県"]
        : Object.values(REGION_OF).includes(t) ? prefs.filter(p => REGION_OF[p] === t)
          : pref ? [pref] : [];
    if (covered.some(p => added.has(p))) out.add(t);
  }
  return out;
}
function addedPrefs(d, prefs) {
  if (Array.isArray(d.addedAreas)) {
    const added = [];
    for (const a of d.addedAreas) {
      const p = areaToPref(a);
      if (p && prefs.includes(p) && !added.includes(p)) added.push(p);
    }
    return new Set(added);
  }
  return new Set(prefs.filter(p => !eewState.prefs.has(p)));
}
function renderEEW(d) {
  const prefs = resolvePrefs(d);
  const epi = (Number.isFinite(d.latitude) && Number.isFinite(d.longitude)) ? { lat: d.latitude, lon: d.longitude } : null;
  renderMap(document.getElementById("map-cell"), prefs, d.areas, epi, 214, 262, new Set());
  document.getElementById("headline").textContent =
    (d.hypocenterName ? headlinePlace(d.hypocenterName) + "で地震 " : "") + "強い揺れに警戒";
  fitHeadline(document.getElementById("headline"));
  const areasEl = document.getElementById("areas");
  const lay = layoutAreas(prefs, d.areas);
  areasEl.innerHTML = lay.lines.map(l =>
    '<div style="white-space:nowrap">' + l + "</div>").join("");
  areasEl.style.fontSize = lay.size + "px";
  document.getElementById("eew-box").classList.add("on");
  eewState.prefs = new Set(prefs);
  eewState.zones = new Set(coveredZonesFor(prefs, d.areas));
}
/* 続報: 追加された県だけ地図で点滅させる */
function renderEEWUpdate(d) {
  const prefs = resolvePrefs(d);
  const addedP = addedPrefs(d, prefs);
  const addedZ = new Set(coveredZonesFor(prefs, d.areas).filter(z => !eewState.zones.has(z)));

  const epi = (Number.isFinite(d.latitude) && Number.isFinite(d.longitude)) ? { lat: d.latitude, lon: d.longitude } : null;
  renderMap(document.getElementById("map-cell"), prefs, d.areas, epi, 214, 262, added);
  document.getElementById("headline").textContent =
    (d.hypocenterName ? headlinePlace(d.hypocenterName) + "で地震 " : "") + "強い揺れに警戒";
  fitHeadline(document.getElementById("headline"));
  const areasEl = document.getElementById("areas");
  const lay = layoutAreas(prefs, d.areas);
  const bt = textBlink ? blinkTokens(prefs, d.areas, addedP, addedZ) : new Set();
  areasEl.innerHTML = lay.lines.map(l =>
    '<div style="white-space:nowrap">' + l.split("　").map(t =>
      bt.has(t) ? `<span class="blink-text">${t}</span>` : t).join("　") + "</div>").join("");
  areasEl.style.fontSize = lay.size + "px";
  document.getElementById("eew-box").classList.add("on");
  eewState.prefs = new Set(prefs);
  eewState.zones = new Set(coveredZonesFor(prefs, d.areas));
}
/* 縦パターンの寸法 (既定は 720p 実測値)。逆L字レイアウト等では

const VF = { w: 158, h: 565, mapH: 84, font: 24, ls: 2 };

function renderEEWVertical(d) {

function renderEEWVerticalUpdate(d) {
  const prefs = resolvePrefs(d);
  const addedP = addedPrefs(d, prefs);
  const addedZ = new Set(coveredZonesFor(prefs, d.areas).filter(z => !eewState.zones.has(z)));

  const columns = layoutAreas(prefs, d.areas).lines;

  document.getElementById("eew-v").classList.add("on");
  eewState.prefs = new Set(prefs);
  eewState.zones = new Set(coveredZonesFor(prefs, d.areas));
}
window.renderEEW = renderEEW;
window.renderEEWUpdate = renderEEWUpdate;
