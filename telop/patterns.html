<script>
"use strict";
/* 津波警報等のミニマップ (放送画面右下の透過表示)
   構造は実物のCGと同じ「固定画 + 動的な区域色」:
   - 地図は build_art.js が最終座標 (viewBox 640x510) に焼き込んだ固定画
     (tsunami-art.js)。本土は NHK実放送フレームの白陸マスクから fit した
     全体アフィン (残差 平均10.0 / 最大20.4)、沖縄・奄美の列島は単一の相似
     配置、小笠原はブラケット内への単一配置、伊豆は並べ直しを焼き込み。
   - 島の誇張は島グループ単位で陸地と区域線が同じ中心・倍率を共有する
     (ビルダー側で統一済み)。実行時に投影・振り分け・拡大は一切しない。
   - 発表対象の予報区だけ海岸線を種別色の太線で上描きし点滅させる。
     点滅周期は実放送の実測で 3秒 (点灯 約2.25秒 / 消灯 約0.75秒)。
   - 種別色は全テレビ局統一の推奨値 (伊藤啓・CUDO、2011年合意):
     大津波警報=紫 (200,0,255)、津波警報=赤 (255,40,0)、津波注意報=黄 (250,245,0)。
     大津波警報のラインは他種別の約2倍の太さ (同基準)。
   - 陸地は発表の有無にかかわらず常時描画する (区域線のみ発表時)。
   入力: renderTsunamiMini({ major:[], warning:[], advisory:[], legend:false, blink:true })
         配列要素は予報区名 (例 "岩手県") でもコード (例 210) でもよい。 */
const TM_COLORS = { major:"#c800ff", warning:"#ff2800", advisory:"#faf500" };
const TM_LABELS = { major:"大津波警報", warning:"津波警報", advisory:"津波注意報" };
const TM_W = 640, TM_H = 510;
let ART = window.__PATTERNS["0.9e"];
// 区域線の太さ (焼き込み時に決めた配置ごとの値。本土は旧パネル幅370基準)
const TM_LINE_W = { m:3.9, c:4.1, o:4.1 };

const NAME2CODE = {};
for (const [code, name] of Object.entries(ART.zoneNames)) NAME2CODE[name] = code;

function tmZoneKey(v) {
  if (ART.zones[String(v)]) return String(v);
  return NAME2CODE[v] || null;
}

/* 仕切りの折れ線・ブラケット・ラベル (お手本の出し方、実測値) */
const TM_DECOR = [
  // 沖縄の分離線: 縦・斜め・横の3直線 (実物の様式)。列島の位置は固定で、
  // 線を沖縄側へ寄せた経路。固定画の陸地マスクで最小クリアランス 10.0px、
  // 線と列島の平均距離 35px (寄せる前は 44.5px) を検証済み
  { type:"line", pts:[[290,84],[290,220],[140,274],[36,274]] },
  { type:"line", pts:[[256,499],[256,411],[373,411]] },              // 小笠原の角ブラケット ┌ (2026-11-09 フレーム成分分析で実測)
  { type:"label", x:114, y:170, text:"沖縄", size:34 },              // 周囲14pxまで陸地がないことをマスクで確認した位置
  { type:"label", x:315, y:492, text:"小笠原", size:33 },
];

function renderTsunamiMini(input) {
  input = input || {};
  const root = document.getElementById("tsunami-mini");
  const cat = {};   // code -> 'major'|'warning'|'advisory' (強い順に上書き)
  for (const k of ["advisory", "warning", "major"]) {
    for (const v of (input[k] || [])) {
      const key = tmZoneKey(v);
      if (key) cat[key] = k;
    }
  }
  const blinkCls = input.blink === false ? "" : " tm-blink";
  let g = `<svg class="${blinkCls.trim()}" width="${TM_W}" height="${TM_H}" viewBox="0 0 ${TM_W} ${TM_H}" xmlns="http://www.w3.org/2000/svg">`;
  // 陸地の下地 (陸地パス自身の太い暗ストローク。白ベタの下に敷き、陸の輪郭そのものを縁にする)
  // 区域線 (ART.coast) を下地に使うと、陸地の海岸線と形状が一致せず二重・三重線になるため使わない。
  for (const e of ART.landMain) g += `<path fill="none" stroke="#151515" stroke-width="3.5" stroke-linejoin="round" d="${e.d}"/>`;
  for (const e of ART.landInset) g += `<path fill="none" stroke="#151515" stroke-width="3.5" stroke-linejoin="round" d="${e.d}"/>`;
  // 陸地 (白ベタ、県境は出さない)
  for (const e of ART.landMain) g += `<path class="tm-land" fill-rule="evenodd" d="${e.d}"/>`;
  for (const e of ART.landInset) g += `<path class="tm-land" fill-rule="evenodd" d="${e.d}"/>`;
  // 発表区域の海岸線 (種別色、大津波警報は約2倍)
  for (const k of ["advisory", "warning", "major"]) {
    for (const [code, z] of Object.entries(ART.zones)) {
      if (cat[code] !== k) continue;
      const w = TM_LINE_W[z.a] * (k === "major" ? 1.9 : 1);
      for (const d of z.paths) g += `<path class="tm-zone" stroke="${TM_COLORS[k]}" stroke-width="${w.toFixed(1)}" d="${d}"/>`;
    }
  }
  // 仕切り線・ブラケット・ラベル
  for (const d of TM_DECOR) {
    if (d.type === "line") {
      const pts = d.pts.map(pt => pt.join(",")).join(" ");
      g += `<polyline class="tm-decor" points="${pts}"/><polyline class="tm-decor2" points="${pts}"/>`;
    } else if (d.type === "label") {
      g += `<text class="tm-label" x="${d.x}" y="${d.y}" font-size="${d.size}">${d.text}</text>`;
    }
  }
  if (input.legend !== false) {
    const present = ["major", "warning", "advisory"].filter(k => Object.values(cat).includes(k));
    if (present.length) {
      // 種別ごとに1列 (チップ+縦書き名、列自体が黒箱)、列を横に並べる。実放送の形
      const colW = 48, gap = 15;
      let cx = 436;   // NHKフレーム実測は左端 x386。2026-11-09 ユーザー指示で右へ +50
      const top = 230;
      for (const k of present) {
        g += `<rect x="${cx}" y="${top}" width="${colW}" height="14" rx="4" fill="rgba(0,0,0,.88)"/>`;
        g += `<rect x="${cx + 2}" y="${top + 2}" width="${colW - 4}" height="10" fill="${TM_COLORS[k]}"/>`;
        const name = TM_LABELS[k];
        const boxH = name.length * 34 + 14;
        g += `<rect x="${cx}" y="${top + 17}" width="${colW}" height="${boxH}" rx="5" fill="rgba(0,0,0,.88)"/>`;
        const chars = name.split("").map((c, i) =>
          `<tspan x="${cx + colW / 2}" dy="${i ? 34 : 0}">${c}</tspan>`).join("");
        g += `<text class="tm-legend-label" text-anchor="middle" font-size="30" y="${top + 17 + 40}">${chars}</text>`;
        cx += colW + gap;
      }
    }
  }
  g += "</svg>";
  root.innerHTML = g;
  return cat;
}

const TM_DEMOS = {

  example: {

              "長崎県西方","熊本県天草灘沿岸","鹿児島県西部","佐賀県北部","沖縄本島地方","大東島地方"],

               "奄美群島・トカラ列島","宮古島・八重山地方"],

  // 2011年東北地方太平洋沖地震の初期発表に寄せた例
  tohoku: {

    warning: ["青森県太平洋沿岸","茨城県","千葉県九十九里・外房"],
    advisory: ["北海道太平洋沿岸東部","北海道太平洋沿岸中部","北海道太平洋沿岸西部","青森県日本海沿岸",
               "千葉県内房","東京湾内湾","相模湾・三浦半島","伊豆諸島","静岡県"],
  },
  advisory_all: { advisory: Object.values(ART.zoneNames) },
  none: {},

/* URL エントリ: ?demo=<name> / ?custom=<JSON> */
(function () {
  const q = new URLSearchParams(location.search);
  if (q.get("custom")) {
    try { renderTsunamiMini(JSON.parse(q.get("custom"))); return; } catch (e) { /* fallthrough */ }
  }
  const demo = q.get("demo") || "example";
  renderTsunamiMini(TM_DEMOS[demo] || TM_DEMOS.example);
})();

  function draw(){ ART = window.__PATTERNS[pat]; renderTsunamiMini(Object.assign({}, cur, { legend, blink }));
    document.querySelectorAll("[data-pat]").forEach(b => b.classList.toggle("on", b.dataset.pat === pat)); }
  draw();
  document.querySelectorAll("[data-pat]").forEach(b => b.onclick = () => { pat = b.dataset.pat; draw(); });
  document.querySelectorAll("[data-demo]").forEach(b => b.onclick = () => { cur = TM_DEMOS[b.dataset.demo]; draw(); });
  document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => { document.getElementById("tm-bg").style.background = b.dataset.bg; });
