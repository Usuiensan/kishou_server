<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アトラス送出 試験操作</title>
<style>
  body{font:16px system-ui,sans-serif;max-width:900px;margin:24px auto;padding:0 16px;background:#111827;color:#e5e7eb}
  h1{font-size:1.5rem} section{background:#1f2937;border:1px solid #374151;border-radius:8px;padding:16px;margin:14px 0}
  textarea{box-sizing:border-box;width:100%;min-height:130px;background:#0b1220;color:#e5e7eb;border:1px solid #4b5563;padding:10px;font:14px monospace}
  input,select,button{font:inherit;padding:7px;margin:4px 4px 4px 0} label{display:inline-block;margin:4px 10px 4px 0}
  button{cursor:pointer} pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0b1220;padding:12px;min-height:48px}
</style>
<h1>アトラス送出 試験操作</h1>
<p>この画面はローカル試験用です。送出映像の状態を操作します。</p>

<section>
  <h2>L字・情報テロップ</h2>
  <button onclick="setLband(true)">L字起動</button>
  <button onclick="setLband(false)">L字終了</button>
  <button onclick="preset('eew')">緊急地震速報</button>
  <button onclick="preset('tsunami')">津波</button>
  <button onclick="preset('earthquake')">地震テロップ</button>
</section>

<section>
  <h2>EEW / 津波イベント投入</h2>
  <p>JMA XML、または <code>{"events":[...]}</code> 形式のJSONを貼り付けてください。</p>
  <textarea id="event" placeholder="ここにJMA XMLまたはJSONを貼り付け"></textarea><br>
  <button onclick="submitEvent()">イベント投入</button>
</section>

<section>
  <h2>表示モード・メタデータ</h2>
  <p>空欄の値は変更しません。</p>
  <div id="modeFields"></div>
  <button onclick="setMode()">表示値を更新</button>
</section>

<section>
  <h2>自動シナリオ</h2>
  <p>時刻指定で events / mode / reset / fault を実行します。</p>
  <textarea id="scenario">{"steps":[
  {"atSeconds":0,"action":"mode","values":{"flags":7,"opacity":220}},
  {"atSeconds":5,"action":"reset"}
]}</textarea><br>
  <button onclick="runScenario()">シナリオ実行</button>
</section>

<section>
  <h2>障害再現</h2>
  <select id="faultChild"><option>sender</option><option>renderer</option><option>ingest</option><option>mediamtx</option></select>
  <select id="faultAction"><option value="stop">停止</option><option value="resume">再開</option></select>
  <button onclick="fault()">実行</button>
</section>

<section>
  <h2>状態</h2><button onclick="refreshStatus()">今すぐ更新</button>
  <button onclick="resetState()">表示をリセット</button>
  <pre id="status">読み込み中...</pre>
</section>
<section><h2>操作結果</h2><pre id="result">未操作</pre></section>

<script>
const $ = id => document.getElementById(id);
const fields = [['flags','Flags',255],['mode','Mode',255],['opacity','Opacity',255],['lower_x','Lower X',65535],['lower_y','Lower Y',65535]];
$("modeFields").innerHTML = fields.map(([key,label,max]) => `<label>${label} <input type="number" id="${key}" min="0" max="${max}" placeholder="変更なし"></label>`).join('');
async function api(path, body, type='application/json') {
  const response = await fetch(path, {method:'POST',headers:{'content-type':type},body:typeof body==='string'?body:JSON.stringify(body)});
  const data = await response.json();
  if (!response.ok) throw new Error(data.error || response.statusText);
  return data;
}
async function act(fn) { try { const data=await fn(); $('result').textContent=JSON.stringify(data,null,2); refreshStatus(); } catch(e) { $('result').textContent='エラー: '+e.message; } }
function submitEvent() {
  const value=$('event').value.trim();
  if (!value) { $('result').textContent='XMLまたはJSONを入力してください'; return; }
  let body=value, type='application/xml';
  try { body=JSON.stringify(JSON.parse(value)); type='application/json'; } catch {}
  act(()=>api('/test/events',body,type));
}
function setLband(active) { act(()=>api('/test/mode',{flags:active?15:0})); }
function preset(name) { act(()=>api('/test/presets/'+name,{})); }
function setMode() {
  const values={};
  for (const [key] of fields) if ($(key).value!=='') values[key]=Number($(key).value);
  act(()=>api('/test/mode',values));
}
function runScenario() { try { act(()=>api('/test/scenarios/run',JSON.parse($('scenario').value))); } catch(e) { $('result').textContent='JSONエラー: '+e.message; } }
function fault() { act(()=>api('/test/fault',{child:$('faultChild').value,action:$('faultAction').value})); }
function resetState() { act(()=>api('/test/reset',{})); }
async function refreshStatus() { try { const r=await fetch('/test/status'); $('status').textContent=JSON.stringify(await r.json(),null,2); } catch(e) { $('status').textContent='状態取得失敗: '+e.message; } }
refreshStatus(); setInterval(refreshStatus,2000);
</script>
</html>
